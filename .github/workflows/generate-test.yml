name: Generate & Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  render-script:
    name: Lint render script
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.13"

      - name: Lint render script
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-template.txt
          ruff check --extend-exclude=.github/workflows/ scripts/
          python -m unittest discover -s scripts -p "test_*.py" -v

    timeout-minutes: 30
  generate:
    name: Generate project
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.13"

      - name: Install render deps
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-template.txt

      - name: Generate project
        run: |
          python scripts/render_template.py generated_project

      - name: Show generated structure
        run: |
          find generated_project -name "*.py" | sort

      - name: Upload generated project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: generated-project
          path: generated_project
          retention-days: 1
          include-hidden-files: true

    timeout-minutes: 30
  test-generated:
    name: Test generated project
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    needs: generate
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.13"

      - name: Download generated project
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-project
          path: generated_project

      - name: Install generated project
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-template.txt
          # All third-party dependencies and build tools came from the hashed lock above.
          pip install --no-deps --no-build-isolation ./generated_project

      - name: Ruff check (src)
        run: |
          ruff check generated_project/src/

      - name: Analyze generated Python for security flaws
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-bandit-1.9.2.txt
          python -m bandit -r generated_project/src/ -ll

      - name: Pytest
        run: |
          pytest generated_project/tests/ -v --cov=my_d_bus_service --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          name: generated-project
    timeout-minutes: 30
