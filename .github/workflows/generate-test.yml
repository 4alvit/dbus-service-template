name: Generate & Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  render-script:
    name: Lint render script
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Lint render script
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-template.txt
          ruff check --extend-exclude=.github/workflows/ scripts/
          python -m unittest discover -s scripts -p "test_*.py" -v

    timeout-minutes: 30
  generate:
    name: Generate project
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Install render deps
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-template.txt

      - name: Generate project
        run: |
          python scripts/render_template.py generated_project

      - name: Show generated structure
        run: |
          find generated_project -name "*.py" | sort

      - name: Upload generated project
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-project
          path: generated_project
          retention-days: 1
          include-hidden-files: true

    timeout-minutes: 30
  test-generated:
    name: Test generated project
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    needs: generate
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.13"

      - name: Download generated project
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-project
          path: generated_project

      - name: Install generated project
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-template.txt
          # All third-party dependencies and build tools came from the hashed lock above.
          pip install --no-deps --no-build-isolation ./generated_project

      - name: Ruff check (src)
        run: |
          ruff check generated_project/src/

      - name: Pytest
        run: |
          pytest generated_project/tests/ -v --cov=my_d_bus_service --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          name: generated-project
    timeout-minutes: 30
