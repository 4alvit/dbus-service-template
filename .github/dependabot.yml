version: 2
updates:
  - package-ecosystem: github-actions
    # Update fuzz together with toolkit-ref and the release policy.
    ignore:
      - dependency-name: "victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml"
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
